<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astrology Finder</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <h1>🔮 Astrology Finder</h1>
    <p>Enter your details to discover your Zodiac Sign</p>
    
    <form id="astroForm">
      <input type="text" id="name" placeholder="First Name" required>
      <input type="text" id="surname" placeholder="Surname" required>
      <input type="number" id="day" placeholder="Day (1-31)" required>
      <input type="number" id="month" placeholder="Month (1-12)" required>
      <input type="number" id="year" placeholder="Year (e.g. 1998)" required>
      <button type="submit">Find My Zodiac</button>
    </form>
    
    <div id="result"></div>
  </div>
  
  <script src="./index.js"></script>
</body>
</html>
